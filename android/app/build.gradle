plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qoder.poetry'
    compileSdk 34

    defaultConfig {
        applicationId "com.qoder.poetry"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        resourceConfigurations += ['zh-rCN']
    }

    // 签名密钥与口令不入库（见 .gitignore）。需要打出签名包时，把 release.keystore
    // 放到 android/ 下，并另建 android/keystore.properties（同样不入库）：
    //     storeFile=release.keystore
    //     storePassword=<口令>
    //     keyAlias=<别名>
    //     keyPassword=<口令>
    signingConfigs {
        release {
            def ksFile = rootProject.file('keystore.properties')
            if (ksFile.exists()) {
                def ksProps = new Properties()
                ksFile.withInputStream { ksProps.load(it) }
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            // 未配置签名信息时产出未签名包，构建不会因此失败
            if (signingConfigs.release.isSigningReady()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
}
